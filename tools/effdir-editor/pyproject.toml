[project]
name = "effdir-editor"
version = "0.2.1"
description = "Cross-platform wxPython editor for the SimCity 4 packed EFFDIR resource format"
readme = "README.md"
license = "GPL-3.0-or-later"
authors = [
    { name = "Casper Van Gheluwe", email = "caspervg@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "wxpython>=4.3.1",
]

[project.scripts]
effdir-editor = "effdir_editor:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
build = [
    "pyinstaller>=6.14",
]
