name: EFFDIR Editor CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: effdir-editor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Smoke check
    runs-on: windows-latest

    defaults:
      run:
        working-directory: tools/effdir-editor

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          cache-dependency-glob: "tools/effdir-editor/uv.lock"

      - name: Install Python
        run: uv python install 3.12

      - name: Sync environment
        run: uv sync --python 3.12 --group dev

      - name: Compile check
        run: uv run --python 3.12 python -m compileall -q src/effdir_editor

      - name: Import check
        run: |
          uv run --python 3.12 python -c "import effdir_editor; print(f'import OK: {effdir_editor.__version__}')"

      - name: Test
        run: uv run --python 3.12 pytest
